name: mindful
description: "Y — anonymous mental health community and personal wellness tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Latin UI font (variable weight axis). OFL - see assets/fonts/Urbanist-OFL.txt
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Variable.ttf
    # Arabic UI font, used as fallback for Arabic glyphs. OFL - see assets/fonts/IBMPlexSansArabic-OFL.txt
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700