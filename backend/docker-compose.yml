name: mental

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: mental-php:dev
  volumes:
    - ./:/var/www/html
    - ../docs:/var/www/docs:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3 --backoff=10
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.json
    volumes:
      - ../docs/openapi:/docs:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mental
      POSTGRES_USER: mental
      POSTGRES_PASSWORD: secret
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mental -d mental"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
